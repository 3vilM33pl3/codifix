name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: memory-self-hosted-runners
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: [self-hosted, memory, Linux, X64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      db: ${{ steps.filter.outputs.db }}
      web: ${{ steps.filter.outputs.web }}
      docs_site: ${{ steps.filter.outputs.docs_site }}
      evals: ${{ steps.filter.outputs.evals }}
      package: ${{ steps.filter.outputs.package }}
      plugin: ${{ steps.filter.outputs.plugin }}
      formal: ${{ steps.filter.outputs.formal }}
      federation_pds: ${{ steps.filter.outputs.federation_pds }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - "fixtures/federation/**"
              - "migrations/**"
              - "memory-layer.toml.example"
            db:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/mem-record/**"
              - "crates/mem-config/**"
              - "crates/mem-curate/**"
              - "crates/mem-graph/**"
              - "crates/mem-search/**"
              - "crates/mem-service/**"
              - "crates/mem-test-support/**"
              - "crates/mem-store/**"
              - "crates/mem-platform/**"
              - "crates/mem-loops/**"
              - "crates/mem-cli/**"
              - "scripts/r1-process-smoke.mjs"
              - ".github/workflows/ci.yml"
              - "crates/mem-federation/**"
              - "crates/mem-federation-store/**"
              - "crates/mem-federation-runtime/**"
              - "crates/mem-atproto/**"
              - "crates/mem-atproto-verify/**"
              - "migrations/**"
            web:
              - "web/**"
            docs_site:
              - "docs-site/**"
            evals:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/mem-cli/**"
              - "crates/mem-eval/**"
              - "crates/mem-record/**"
              - "crates/mem-config/**"
              - "evals/**"
            package:
              - "Cargo.toml"
              - "Cargo.lock"
              - "web/**"
              - "packaging/**"
              - ".agents/skills/**"
              - "README.md"
              - "memory-layer.toml.example"
            plugin:
              - "plugins/memory-layer/**"
              - ".agents/plugins/marketplace.json"
              - "scripts/check-codex-plugin.py"
              - "docs/user/codex-desktop-plugin.md"
            formal:
              - "formal/memory-federation/**"
              - "fixtures/federation/traces/**"
              - "fixtures/federation/publication-traces/**"
              - "crates/mem-federation/**"
            federation_pds:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/mem-federation/**"
              - "crates/mem-federation-store/**"
              - "crates/mem-federation-runtime/**"
              - "crates/mem-service/**"
              - "crates/mem-cli/**"
              - "web/**"
              - "migrations/**"
              - "tests/federation-pds/**"
              - "tests/federation-isolation/**"
              - "deploy/federation/**"
              - "fixtures/federation/upstream-lock.json"
              - "crates/mem-atproto/**"
              - "crates/mem-atproto-verify/**"
              - "fixtures/federation/atproto/**"
              - ".github/workflows/ci.yml"

  federation-pds:
    name: Private PDS Prerequisites and Durable Federation
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.federation_pds == 'true'
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORY_LAYER_TEST_DATABASE_URL: postgres://memory:memory@localhost:55433/memory_test
      MEMORY_LAYER_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: docker pull ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
      - run: node tests/federation-pds/backup.test.cjs
      - run: node tests/federation-pds/run.mjs
      - run: cargo test -p mem-federation-runtime --test c_workflow --locked --no-run
      - run: cargo build -p mem-cli --locked
      - run: npm --prefix web ci
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - run: npx playwright install chromium
        working-directory: web
      - name: F1 browser collection and queued-question rehearsal
        run: cargo test -p mem-service f1_browser_collection --lib --locked -- --nocapture
        env:
          MEMORY_FEDERATION_F1_BROWSER: "1"
      - run: node tests/federation-pds/run.mjs --runtime
        env:
          MEMORY_FEDERATION_E_CLIENTS: "1"
      - run: node tests/federation-isolation/run.mjs

  plugin-contract:
    name: Codex Plugin Contract
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-codex-plugin.py

  formal-proof:
    name: Federation Formal Proofs
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/memory-federation
          build: true
          test: true
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

  rust-fmt:
    name: Rust Format
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  rust-test:
    name: Rust Tests
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked

  rust-clippy:
    name: Rust Clippy
    runs-on: [self-hosted, memory, Linux, X64]
    needs: [changes, rust-test]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  db-integration:
    name: DB Integration
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.evals == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORY_LAYER_TEST_DATABASE_URL: postgres://memory:memory@localhost:55432/memory_test
      MEMORY_LAYER_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Tests create independent databases and owner sessions. Bound the harness,
      # not the explicitly concurrent transactions/workers exercised by tests.
      - run: cargo test --workspace --all-targets --locked
        env:
          RUST_TEST_THREADS: 8
      - run: cargo build -p mem-cli --bin memory --locked
      - run: node scripts/r1-process-smoke.mjs
      - name: Verify R3 snapshot owner and foreground service
        run: |
          cargo build -p mem-test-support --example r3_snapshot --locked
          cargo build -p mem-eval --example r3_score --locked
          cargo build -p mem-eval --example r3_budget --locked
          r3_fixture_image=ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
          docker pull "$r3_fixture_image"
          r3_container_image=$(docker image inspect --format '{{.Id}}' "$r3_fixture_image")
          MEMORY_R3_SNAPSHOT_BIN="$PWD/target/debug/examples/r3_snapshot" MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" MEMORY_R3_REQUIRE_SNAPSHOT=1 \
            MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_REQUIRE_SERVICE_ANSWER=1 \
            node --test evals/r3/snapshot.test.mjs
          MEMORY_R3_SNAPSHOT_BIN="$PWD/target/debug/examples/r3_snapshot" MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" \
            MEMORY_R3_BUDGET_BIN="$PWD/target/debug/examples/r3_budget" MEMORY_R3_REQUIRE_BUDGETED_SERVICE=1 MEMORY_R3_REQUIRE_MEDIATOR=1 MEMORY_R3_REQUIRE_MODEL_AGENT=1 MEMORY_R3_REQUIRE_MODEL_ANSWER=1 \
            MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_REQUIRE_SERVICE_SESSION=1 \
            node --test evals/r3/isolation/service-session.test.mjs evals/r3/isolation/embedding-proxy.test.mjs evals/r3/request-mediator.test.mjs evals/r3/isolation/model-agent.test.mjs evals/r3/isolation/model-answer.test.mjs
          cargo build -p mem-eval --example r3_retriever --locked
          docker build --network=none -f evals/r3/isolation/Dockerfile.rust -t memory-r3-rust:offline evals/r3/isolation
          r3_rust_image=$(docker image inspect --format '{{.Id}}' memory-r3-rust:offline)
          MEMORY_R3_SNAPSHOT_BIN="$PWD/target/debug/examples/r3_snapshot" MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" \
            MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_RUST_IMAGE="$r3_rust_image" \
            MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_RETRIEVER_BIN="$PWD/target/debug/examples/r3_retriever" MEMORY_R3_REQUIRE_REHEARSAL_TASK=1 \
            node --test evals/r3/isolation/rehearsal-task.test.mjs
          MEMORY_R3_SNAPSHOT_BIN="$PWD/target/debug/examples/r3_snapshot" MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" \
            MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_RUST_IMAGE="$r3_rust_image" \
            MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_RETRIEVER_BIN="$PWD/target/debug/examples/r3_retriever" MEMORY_R3_REQUIRE_REHEARSAL=1 \
            node --test evals/r3/rehearse.test.mjs
          MEMORY_R3_SNAPSHOT_BIN="$PWD/target/debug/examples/r3_snapshot" MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" \
            MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_RUST_IMAGE="$r3_rust_image" \
            MEMORY_R3_BUDGET_BIN="$PWD/target/debug/examples/r3_budget" MEMORY_R3_MEDIATED=1 \
            MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_RETRIEVER_BIN="$PWD/target/debug/examples/r3_retriever" MEMORY_R3_REQUIRE_REHEARSAL=1 \
            node --test evals/r3/rehearse.test.mjs


  feature-matrix:
    name: Feature Matrix
    runs-on: [self-hosted, memory, Linux, X64]
    needs: [changes, rust-test]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check -p mem-cli --no-default-features --locked
      - run: cargo check -p mem-cli --no-default-features --features tui --locked
      - run: cargo check -p mem-cli --locked
      - run: cargo check -p mem-cli --features full --locked
      - run: cargo check -p mem-service --no-default-features --locked
      - run: cargo clippy -p mem-cli --features full --all-targets --locked -- -D warnings
      - run: ./scripts/check-boundaries.sh

  offline-eval:
    name: Offline Eval Smoke
    runs-on: [self-hosted, memory, Linux, X64]
    needs: [changes, rust-test]
    if: needs.changes.outputs.evals == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify draft R3 review material without providers
        run: |
          r3_review_root=$(mktemp -d)
          node evals/r3/build-review-pack.mjs "$r3_review_root/pack"
          node evals/r3/verify-review-pack.mjs "$r3_review_root/pack"
          cargo run --locked --bin memory -- eval campaign plan \
            --manifest "$r3_review_root/pack/campaign.json" --split held-out
        env:
          MEMORY_LAYER_PROFILE: prod
      - name: Verify R3 offline container boundary with synthetic commands
        run: |
          r3_fixture_image=ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
          docker pull "$r3_fixture_image"
          r3_container_image=$(docker image inspect --format '{{.Id}}' "$r3_fixture_image")
          MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_REQUIRE_CONTAINER=1 \
            node --test evals/r3/isolation/container.test.mjs evals/r3/isolation/sequence.test.mjs
      - name: Verify isolated Rust black-box grading
        run: |
          docker build --network=none -f evals/r3/isolation/Dockerfile.rust -t memory-r3-rust:offline evals/r3/isolation
          r3_rust_image=$(docker image inspect --format '{{.Id}}' memory-r3-rust:offline)
          MEMORY_R3_RUST_IMAGE="$r3_rust_image" MEMORY_R3_REQUIRE_RUST=1 \
            node --test evals/r3/isolation/rust.test.mjs evals/r3/representative.test.mjs evals/r3/held-out.test.mjs
      - name: Verify R3 external baseline adapter
        run: |
          cargo build -p mem-eval --example r3_retriever --locked
          MEMORY_R3_RETRIEVER_BIN="$PWD/target/debug/examples/r3_retriever" MEMORY_R3_REQUIRE_RETRIEVER=1 \
            node --test evals/r3/retriever.test.mjs
      - name: Verify R3 blinded adjudication utility
        run: |
          cargo build -p mem-eval --example r3_score --locked
          MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_REQUIRE_SCORE=1 \
            node --test evals/r3/scoring.test.mjs
          MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" MEMORY_R3_REQUIRE_REVIEW=1 \
            node --test evals/r3/review.test.mjs evals/r3/responses-receipt.test.mjs evals/r3/synthetic-embedding.test.mjs
      - name: Verify R3 retrieved context and isolated knowledge answering
        run: |
          r3_container_image=$(docker image inspect --format '{{.Id}}' ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12)
          MEMORY_R3_TEST_IMAGE="$r3_container_image" MEMORY_R3_SCORE_BIN="$PWD/target/debug/examples/r3_score" \
            MEMORY_R3_RETRIEVER_BIN="$PWD/target/debug/examples/r3_retriever" MEMORY_R3_REQUIRE_KNOWLEDGE=1 \
            node --test evals/r3/isolation/knowledge.test.mjs
      - name: Verify R3 campaign dispatch and explicit recovery
        run: |
          MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" MEMORY_R3_REQUIRE_REPRESENTATIVE_PACK=1 \
            node --test evals/r3/representative-pack.test.mjs
          MEMORY_R3_CLI_BIN="$PWD/target/debug/memory" MEMORY_R3_REQUIRE_RUNNER=1 \
            node --test evals/r3/runner.test.mjs
      - run: |
          cp memory-layer.toml.example "$RUNNER_TEMP/memory-layer.toml"
          cargo run --locked --bin memory -- \
            --config "$RUNNER_TEMP/memory-layer.toml" \
            eval run \
            --suite evals/examples/memory-smoke \
            --condition full-memory \
            --profile offline \
            --dry-run
        env:
          MEMORY_LAYER_PROFILE: prod

  web-build:
    name: Web Build
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  docs-site:
    name: Docs Site
    runs-on: [self-hosted, memory, Linux, X64]
    needs: changes
    if: needs.changes.outputs.docs_site == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site run build
      - run: npm --prefix docs-site run lint:links
      - run: npm --prefix docs-site run check:assets

  package-smoke:
    name: Debian Package Smoke (amd64)
    runs-on: [self-hosted, memory, Linux, X64]
    needs: [changes, rust-test, web-build]
    if: needs.changes.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./packaging/build-deb.sh --arch amd64 --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: memory-layer-deb-amd64
          path: target/debian/*_amd64.deb
          if-no-files-found: error
