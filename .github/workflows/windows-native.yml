name: Native Windows platform smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/mem-platform/**'
      - 'crates/mem-platform-files/**'
      - 'crates/mem-cli/src/commands/auth_enrollment/**'
      - 'crates/mem-cli/Cargo.toml'
      - 'packaging/windows/**'
      - '.github/workflows/windows-native.yml'

permissions:
  contents: read

jobs:
  platform:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Native protected files, journals and platform smoke
        shell: pwsh
        run: |
          ./packaging/windows/test-release-identity.ps1
          ./packaging/windows/native-instance-validation-tests.ps1
          ./packaging/windows/check-platform.ps1
      - name: Native Credential Manager and onboarding path smoke
        shell: pwsh
        run: ./packaging/windows/check-onboarding.ps1

# Complete required-database, PDS, Pi/AppContainer and installer acceptance runs
# remain on the disposable VM. This job is not a native-release certification.
