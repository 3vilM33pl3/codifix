name: Desktop Linux
on:
  pull_request:
    paths: ['desktop/**', 'crates/codifix-record/**', 'crates/codifix-supervisor/**', 'web/src/types.ts', 'web/src/features/jobs/types.ts', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'crates/codifix-record/**', 'crates/codifix-supervisor/**', 'web/src/types.ts', 'web/src/features/jobs/types.ts', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libssl-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: npm run desktop:build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: codifix-linux-amd64
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
