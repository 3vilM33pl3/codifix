[package]
name = "codifix-desktop"
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Olivier Van Acker"]
description = "A streamlined desktop client for Codifix project knowledge"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "cookies", "json", "stream"] }
url = "2"
tokio = { version = "1", features = ["sync"] }
toml = "0.8"
open = "5"

uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tauri-plugin-single-instance = "2"
codifix-record = { path = "../../crates/codifix-record" }
