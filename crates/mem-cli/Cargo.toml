[package]
name = "mem-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm = { workspace = true, optional = true }
mem-agenttop = { path = "../mem-agenttop" }
mem-analyze = { path = "../mem-analyze" }
mem-config = { path = "../mem-config" }
mem-record = { path = "../mem-record" }
mem-federation-runtime = { path = "../mem-federation-runtime", optional = true }
sqlx = { workspace = true, optional = true }
mem-eval = { path = "../mem-eval" }
mem-graph = { path = "../mem-graph" }
mem-mcp = { path = "../mem-mcp" }
mem-platform = { path = "../mem-platform" }
mem-service = { path = "../mem-service", optional = true, default-features = false }
mem-skills = { path = "../mem-skills" }
mem-watch = { path = "../mem-watch" }
ratatui = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
similar.workspace = true
sha2.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
toml.workspace = true
humantime = "2"
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"


[features]
default = ["full"]
tui = ["dep:ratatui", "dep:crossterm"]
project-sync = ["dep:mem-federation-runtime", "dep:sqlx"]
embedded-service-postgres = ["dep:mem-service", "project-sync"]
embedded-service = ["embedded-service-postgres", "mem-service/offline"]
full = ["tui", "embedded-service"]

[[bin]]
name = "memory"
path = "src/main.rs"

[lints]
workspace = true
