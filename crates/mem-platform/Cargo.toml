[package]
name = "mem-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
windows-native-tests = []

[[bin]]
name = "memory-windows-isolation-probe"
path = "src/bin/memory-windows-isolation-probe.rs"
required-features = ["windows-native-tests"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
sysinfo.workspace = true
mem-platform-files = { path = "../mem-platform-files" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Pipes"] }

[lints]
workspace = true
