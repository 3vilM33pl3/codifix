[package]
name = "codifix-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
windows-native-tests = []
windows-evaluation-helper = []

[[bin]]
name = "codifix-windows-evaluation-helper"
path = "src/bin/codifix-windows-evaluation-helper.rs"
required-features = ["windows-evaluation-helper"]

[[bin]]
name = "codifix-windows-isolation-probe"
path = "src/bin/codifix-windows-isolation-probe.rs"
required-features = ["windows-native-tests"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
sysinfo.workspace = true
codifix-platform-files = { path = "../codifix-platform-files" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Com", "Win32_UI_Shell"] }

[lints]
workspace = true
