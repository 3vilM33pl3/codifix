[package]
name = "codifix-area-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "codifix-area-import"
path = "src/main.rs"

[[bin]]
name = "codifix-gateway-schema"
path = "src/bin/codifix-gateway-schema.rs"

[dependencies]
codifix-area = { path = "../codifix-area" }
codifix-area-store = { path = "../codifix-area-store" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
codifix-platform-files = { path = "../codifix-platform-files" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
codifix-test-support = { path = "../codifix-test-support" }
tempfile = "3.27.0"
percent-encoding = "2.3.2"

[lints]
workspace = true
