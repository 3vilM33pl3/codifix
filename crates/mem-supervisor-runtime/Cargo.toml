[package]
name = "mem-supervisor-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mem-supervisor = { path = "../mem-supervisor" }
mem-supervisor-store = { path = "../mem-supervisor-store" }
mem-supervisor-pi = { path = "../mem-supervisor-pi" }
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum.workspace = true
tokio.workspace = true
subtle = "2.6.1"
sqlx.workspace = true
tempfile = "3.27.0"
toml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
mem-platform = { path = "../mem-platform" }
mem-platform-files = { path = "../mem-platform-files" }
tower = { version = "0.5.3", features = ["util"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[dev-dependencies]
mem-test-support = { path = "../mem-test-support" }

[lints]
workspace = true
