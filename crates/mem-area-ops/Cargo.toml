[package]
name = "mem-area-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "memory-area-import"
path = "src/main.rs"

[[bin]]
name = "memory-gateway-schema"
path = "src/bin/memory-gateway-schema.rs"

[dependencies]
mem-area = { path = "../mem-area" }
mem-area-store = { path = "../mem-area-store" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
mem-platform-files = { path = "../mem-platform-files" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
mem-test-support = { path = "../mem-test-support" }
tempfile = "3.27.0"
percent-encoding = "2.3.2"

[lints]
workspace = true
