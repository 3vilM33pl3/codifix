[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
codifix-platform = { path = "../codifix-platform" }

[dev-dependencies]
codifix-supervisor-runtime = { path = "../codifix-supervisor-runtime" }

[lints]
workspace = true
