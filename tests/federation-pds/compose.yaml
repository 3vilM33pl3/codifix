# Disposable private-PDS prerequisite gate, NOT a production deployment.
services:
  pds: &pds
    image: ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    environment: &pds-environment
      PDS_PORT: "2583"
      PDS_HOSTNAME: pds.federation.example.com
      PDS_SERVICE_HANDLE_DOMAINS: .federation.example.com
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blobs
      PDS_JWT_SECRET: ${GATE_JWT_SECRET:?}
      PDS_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${GATE_ROTATION_KEY:?}
      PDS_INVITE_REQUIRED: "true"
      PDS_DEV_MODE: "false"
      PDS_DISABLE_SSRF_PROTECTION: "false"
      PDS_CRAWLERS: ""
      PDS_DID_PLC_URL: https://unavailable.federation.example.com
      NODE_EXTRA_CA_CERTS: /gate-tls/cert.pem
      LOG_LEVEL: warn
    volumes:
      - pds:/pds
      - ${GATE_RUNTIME_DIR:?}/tls:/gate-tls:ro
    networks: [private]
  pds-recovery:
    <<: *pds
    environment:
      <<: *pds-environment
      PDS_HOSTNAME: recovery.federation.example.com
    volumes:
      - recovery:/pds
      - ${GATE_RUNTIME_DIR:?}/tls:/gate-tls:ro
  pds-restored:
    <<: *pds
    profiles: [restore]
    environment:
      <<: *pds-environment
      PDS_HOSTNAME: recovery.federation.example.com
    volumes:
      - restored:/pds
      - ${GATE_RUNTIME_DIR:?}/tls:/gate-tls:ro
  backup: &backup
    image: ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    profiles: [maintenance]
    entrypoint: [node, /gate/backup.cjs]
    environment:
      GATE_HOST_UID: ${GATE_HOST_UID:?}
      GATE_HOST_GID: ${GATE_HOST_GID:?}
      GATE_JWT_SECRET: ${GATE_JWT_SECRET:?}
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?}
      GATE_ROTATION_KEY: ${GATE_ROTATION_KEY:?}
    volumes:
      - recovery:/source:ro
      - restored:/restore
      - ./backup.cjs:/gate/backup.cjs:ro
      - ${GATE_RUNTIME_DIR:?}/key:/gate-key:ro
      - ${GATE_RUNTIME_DIR:?}/state:/gate-state
    networks: [private]
  restore:
    <<: *backup
    volumes:
      - restored:/restore
      - ./backup.cjs:/gate/backup.cjs:ro
      - ${GATE_RUNTIME_DIR:?}/key:/gate-key:ro
      - ${GATE_RUNTIME_DIR:?}/state:/gate-state
  probe:
    image: ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    entrypoint: [node, /gate/probe.cjs]
    environment:
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?}
      GATE_PHASE: ${GATE_PHASE:-seed}
      NODE_EXTRA_CA_CERTS: /gate-tls/cert.pem
    volumes:
      - ./probe.cjs:/gate/probe.cjs:ro
      - ../../crates/mem-atproto/lexicons:/gate/lexicons:ro
      - ../../fixtures/federation/atproto/xrpc/create_record_request.json:/gate/create_record_request.json:ro
      - ${GATE_RUNTIME_DIR:?}/tls:/gate-tls:ro
      - ${GATE_RUNTIME_DIR:?}/state:/gate-state
    networks:
      private:
        aliases:
          - space.federation.example.com
          - pds.federation.example.com
          - recovery.federation.example.com
networks:
  private:
    internal: true
volumes:
  pds:
  recovery:
  restored:
