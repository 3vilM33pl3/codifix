[workspace]
members = [
  "crates/codifix-area",
  "crates/codifix-area-store",
  "crates/codifix-area-ops",
  "crates/codifix-agenttop",
  "crates/codifix-analyze",
  "crates/codifix-atproto",
  "crates/codifix-atproto-verify",
  "crates/codifix-platform",
  "crates/codifix-platform-files",
  "crates/codifix-federation",
  "crates/codifix-federation-store",
  "crates/codifix-federation-runtime",
  "crates/codifix-record",
  "crates/codifix-store",
  "crates/codifix-supervisor",
  "crates/codifix-supervisor-pi",
  "crates/codifix-supervisor-runtime",
  "crates/codifix-supervisor-store",
  "crates/codifix-config",
  "crates/codifix-watch",
  "crates/codifix-cli",
  "crates/codifix-curate",
  "crates/codifix-consolidate",
  "crates/codifix-test-support",
  "crates/codifix-graph",
  "crates/codifix-eval",
  "crates/codifix-search",
  "crates/codifix-skills",
  "crates/codifix-loops",
  "crates/codifix-reinforce",
  "crates/codifix-service",
  "crates/codifix-mcp",
]
resolver = "2"

[patch.crates-io]
# Preserve the pinned Atrium API/repository baseline while fixing its WASM cache.
atrium-common = { path = "vendor/atrium-common" }

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Olivier Van Acker"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros", "ws"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
clap_complete = "4.5.60"
config = { version = "0.15.18", default-features = false, features = ["toml"] }
duckdb = { version = "1.10506.1", features = ["bundled", "serde_json", "uuid", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["trace", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "http2", "json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
futures-util = "0.3.31"
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
socket2 = "0.5.10"
sysinfo = "0.37.2"
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
sha2 = "0.10.9"
humantime-serde = "1.1.1"
http = "1.3.1"
matchit = "0.8.4"
notify = "8.2.0"
ratatui = "0.30.1"
crossterm = "0.28.1"
pgvector = { version = "0.4.1", features = ["sqlx"] }
tree-sitter = "0.24.7"
tree-sitter-rust = "0.23.3"
tree-sitter-python = "0.23.6"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
regex = "1.12.2"
similar = "2.7.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
toml = "0.8.23"
urlencoding = "2.1.3"
base64 = "0.22.1"
openidconnect = "4.0.1"
rand = "0.9.2"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Reduce local build growth: retain useful workspace debug information without
# accumulating incremental caches or debug symbols for third-party dependencies.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

[profile.release]
lto = true
codegen-units = 1
