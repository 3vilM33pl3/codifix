          application/json:
            schema: { $ref: '#/components/schemas/AuthServiceTokenCreateRequest' }
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthServiceTokenResponse' }
  /v1/auth/tokens/{selector}/revoke:
