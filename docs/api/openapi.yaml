# Memory Layer HTTP API v1 — OpenAPI 3.1 specification.
#
# Source of truth for the public API surface, served by the service at
# GET /v1/openapi.yaml. A contract test in mem-service keeps this file's
# path inventory in sync with the axum router (routes.rs) in both
# directions.
#
# Stability contract: operations marked x-stability: core are frozen —
# existing fields never change meaning, additive fields may appear, and
# clients must ignore unknown fields. Operations marked x-stability:
# internal form the service control plane (loops, watchers, agents,
# admin) and may change between minor versions.
openapi: 3.1.0
info:
  title: Memory Layer API
  version: "1.0"
  description: |
    Local-first project memory for coding agents: capture completed work,
    curate it into durable memories, and query it back with cited answers
    or honest refusals. The service listens on localhost only by default;
    nothing leaves your machine.
servers:
  - url: http://127.0.0.1:4040
    description: Local service (native install default)
  - url: http://localhost:4040
    description: Bundled Docker Compose stack
security:
  - bearerToken: []
paths:
  /v1/onboarding/company-delivery/catalog:
    post:
      operationId: inspectOwnerAuthorizedDeviceCatalog
      x-stability: internal
      summary: Inspect reviewed owner metadata for an exact company human identity
      description: Server-to-server only. Exact configured delivery principal/token and explicit project_scoped_delivery custom permission. Resolve an existing active human by shared issuer/subject, authorize before selecting manifests, and omit ungranted projects. No email lookup, identity creation, Trust offline access, device bearer or owner endpoints. Bounded 512 KiB response; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerDeviceCatalogRequest' }
      responses:
        '200':
          description: Authorized metadata with exact request and manifest digests, not a delivery grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerDeviceCatalogResponse' }
        '403': { description: Exact delegate, policy or current human access denied. }
  /v1/onboarding/company-delivery/approve:
    post:
      operationId: bindCompanyApprovedDeviceToOwnerProject
      x-stability: internal
      summary: Journal an immutable external-device audience without creating local credentials
      description: Company-attested enrollment bound to device/request/credential digest, stable human issuer/subject, exact reviewed non-Trust offline manifest and delivery policy. Owner independently checks current human read/export permission and exact configured delivery token. Maximum 30-day expiry. Exact replay reauthorizes; altered bindings conflict. Approval plus protected audit commit atomically. No local user/device/token/membership creation. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerDeviceApprovalRequest' }
      responses:
        '200':
          description: Historical immutable owner approval receipt, not a statement of future access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerDeviceApprovalReceipt' }
        '403': { description: Current delegate/human/export authority or expiry denied. }
        '409': { description: Changed enrollment or owner manifest; no implicit renewal. }
  /v1/onboarding/company-delivery/subscription:
    post:
      operationId: bootstrapCompanyDeviceOwnerSubscription
      x-stability: internal
      summary: Obtain authenticated selective receipt trust for an approved external device
      description: Exact delivery delegate; freshly reauthorize the retained approval and current owner-local human/catalog before returning scope, audience and receipt keys. No content-page trust adoption or gateway credentials. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerDeviceSubscriptionRequest' }
      responses:
        '200':
          description: Authenticated control-plane bootstrap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceProjectSubscription' }
        '403': { description: Current exact device approval/delegate/human authority denied. }
  /v1/onboarding/company-delivery/snapshot:
    post:
      operationId: deliverCompanyDeviceOwnerProjectPage
      x-stability: internal
      summary: Deliver a signed, audience-bound, project-only snapshot or delta
      description: Reuses verified source selection, reviewer checks, registration reconciliation and gateway attestations. Checks current delegate/human/approval/catalog before gateway HTTP and before serialized delivery commit. Separate immutable external-device nonce journal; altered requests fail. No SQL locks across HTTP, broad repository download, local-device impersonation or laptop bearer forwarding. At most 32 entries/4 MiB; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerDeviceSnapshotRequest' }
      responses:
        '200': { description: Existing signed project-page wire format, not a complete-repository proof. }
        '403': { description: Current delivery authority revoked, expired or denied. }
        '409': { description: Changed binding, nonce replay, catalog or source. }
        '503': { description: Gateway/registration unavailable; retry exact request. }
  /v1/admin/onboarding/company/delivery-delegates:
    get:
      operationId: inspectConfiguredCompanyDeliveryDelegates
      x-stability: internal
      summary: Inspect public delivery-only configured credentials and current state
      description: Multi-user current global administrator on writable primary only. Exact local owner, non-Trust project UUIDs, shared issuer and configured separate credential identities. Current complete credential and custom membership state is checked; never inferred from history. No token value/hash/commitment, endpoint or environment reference. No-store.
      responses:
        '200':
          description: Bounded public configuration and fresh provisioning state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [delegates]
                properties:
                  delegates: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/CompanyDeliveryDelegatePlan' } }
        '403': { description: Multi-user current global administration, writable local owner or exact configuration denied. }
    post:
      operationId: provisionConfiguredCompanyDeliveryDelegate
      x-stability: internal
      summary: Provision a separate delivery-only service credential once
      description: |
        Explicit confirmed multi-user operator workflow on the exact configured non-Trust local
        owner. Configured principal/token identities must be separate from every management
        delegate, absent in storage, with exact issuer/company/owner/area/project/policy binding.
        Creates only explicit project_scoped_delivery custom project permissions, excluded from
        every standard role (including Admin), and no global/read/export/AuthManage rights.
        Existing identities/grants are never adopted or restored. Protected audit and local
        effect commit atomically. First success returns the one-time credential after commit;
        exact replay rechecks active identity/token/original expiry/exact full direct membership
        envelope, returns token:null, and cannot restore expired/revoked/disabled/changed authority.
        Lost first response cannot recover a credential; explicitly revoke and configure fresh
        identities. Ordinary Origin/CSRF/read-only/evaluation controls apply. No owner HTTP,
        device enrollment, fleet activation or generic export grant. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyDeliveryDelegateProvisionRequest' }
      responses:
        '200':
          description: Exact delivery credential binding and one-time secret only on first success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyDeliveryDelegateProvisionResponse' }
        '400': { description: Missing confirmation or invalid bounded identity/name/lifetime. }
        '403': { description: Current administrator, multi-user owner, shared issuer or separate delivery scope denied. }
        '409': { description: Changed request/configuration or existing/inactive/altered credential; no rights restored. }
        '503': { description: Outcome uncertain; retry exact request, never assume one-time secret is recoverable. }
  /v1/onboarding/cache:
    get:
      operationId: listSelectedLaptopCache
      x-stability: internal
      summary: Inspect explicitly configured local read-only project subscriptions
      description: Opt-in isolated laptop service only. Requires a loopback local-owner credential, exact area and bindings, read-only mode, and disabled model/MCP/background work. Never contacts an owner or gateway. Freshness is last committed verified-page time, not a claim of current permission. Missing subscriptions are shown as uninitialized; arbitrary database rows are never listed. No-store.
      responses:
        '200':
          description: Selected subscriptions and local freshness only.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, area, instance_id, projects]
                properties:
                  schema_version: { type: integer, const: 1 }
                  area: { type: string, enum: [workshop, homelab, general] }
                  instance_id: { type: string, format: uuid }
                  projects: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/LaptopCacheProject' } }
        '403': { description: Authenticated loopback local owner required. }
        '404': { description: No laptop cache configured; not a successful empty cache. }
        '503': { description: Bound local projection unavailable or changed; no fallback. }
  /v1/onboarding/cache/{subscription_id}/search:
    parameters:
      - in: path
        name: subscription_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: searchSelectedLaptopCache
      x-stability: internal
      summary: Search one explicitly selected local approved knowledge projection
      description: Semantic read, permitted in the required read-only mode. Ordinary cookie Origin/CSRF protections still apply. No model, embeddings, learning, broader project search, network lookup or timeline write. Plain reviewed text and exact provenance only; results and freshness read from one committed projection snapshot. Responses over 256 KiB fail without partial disclosure. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 4096, description: At most 4096 UTF-8 bytes. }
                limit: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        '200':
          description: Cached cited read-only matches; not model answers or current remote authority.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, project, hits]
                properties:
                  schema_version: { type: integer, const: 1 }
                  project: { $ref: '#/components/schemas/LaptopCacheProject' }
                  hits: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/LaptopCacheHit' } }
        '400': { description: Invalid bounded question or result limit. }
        '403': { description: Authenticated loopback local owner or cookie protections failed. }
        '404': { description: Subscription was not selected for this laptop area. }
        '413': { description: Request or complete response exceeds bounded size. }
        '503': { description: Projection missing, changed or unavailable; no fallback. }
  /v1/admin/onboarding/company/delegates:
    get:
      operationId: inspectConfiguredCompanyDelegates
      x-stability: internal
      summary: Inspect public configured delegate identities and current provisioning state
      description: Current global administrator on a writable primary only. Returns exact local owner, shared issuer, configured service principal/token UUIDs and complete project grant ceilings. State is freshly inspected, not inferred from a historical receipt. No token value, token hash, credential commitment, endpoint or environment reference is returned. Trust administration denied. No-store.
      responses:
        '200':
          description: Up to sixty-four explicitly configured delegates.
          content:
            application/json:
              schema:
                type: object
                required: [delegates]
                properties:
                  delegates: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/CompanyDelegatePlan' } }
        '403': { description: Global administration, writable primary or exact configured scope denied. }
    post:
      operationId: provisionConfiguredCompanyDelegate
      x-stability: internal
      summary: Explicitly provision one configuration-bound restricted service credential
      description: |
        Current global administrator, ordinary CSRF/read-only/evaluation controls and explicit
        confirmation required. The full owner/area/company/issuer/principal/token/policy/project
        ceiling binding must exactly match administrator-owned configuration. Only absent
        identities may be created; existing humans, machines, tokens or grants are never adopted
        or overwritten. Creates no global rights and only exact project memory_read/auth_manage
        overrides. Configured reader/writer/operator ceilings bound delegated human grants, not
        the credential's own permission preset. Effect and protected audit receipt commit together.
        Stable request-ID replay checks active principal/token, bounded original expiry and exact
        memberships, never restores disabled/revoked/changed authority, and never returns the
        secret again. First success returns a one-time credential only after commit. Losing that
        response does not permit secret recovery; revoke and explicitly configure fresh identities
        for replacement. No live owner/IdP call or fleet-device enrollment. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyDelegateProvisionRequest' }
      responses:
        '200':
          description: Exact identity receipt; token is present only on the first successful commit, null on replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyDelegateProvisionResponse' }
        '400': { description: Missing confirmation, reserved identity or invalid bounded credential lifetime. }
        '403': { description: Current global administrator, writable primary, exact configuration or non-Trust owner scope denied. }
        '409': { description: Changed request/configuration or existing, expired, revoked, disabled or altered identity; no rights restored. }
        '503': { description: Outcome unconfirmed; inspect or retry exact request, never assume the one-time secret can be recovered. }
  /v1/onboarding/projects/{project_id}/subscription:
    get:
      operationId: bootstrapApprovedLocalDeviceSubscription
      x-stability: internal
      summary: Bootstrap public project receipt trust from the authenticated owner
      description: Exact local enrolled device and current snapshot eligibility required, including linked human read/export rights, saved catalog revision and offline consent. Trust and remote-owner approvals denied. Public administrator-pinned gateway key schedule only; never a gateway endpoint, credential or database. Clients must authenticate the pinned company/owner control plane and compare every device/area/project/owner/catalog identity before trusting this bootstrap. Never learn receipt trust from scoped content pages. No-store; no gateway HTTP or registration mutation.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Typed public subscription and enrolled receipt keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceProjectSubscription' }
        '401': { description: Credential expired, revoked or absent. }
        '403': { description: Exact enrolled device or current offline authority denied. }
        '409': { description: Saved catalog review or local source binding changed. }
  /v1/onboarding/projects/{project_id}/snapshot:
    post:
      operationId: snapshotApprovedLocalDeviceProject
      x-stability: internal
      summary: Deliver one signed selective page to an enrolled local device
      description: |
        Exact current ServiceToken, token UUID and registered machine/device binding required.
        Browser sessions, installation owners and ordinary machine tokens are denied. Current
        linked human MemoryRead and BundleExport, exact saved reviewed catalog revision and
        offline_allowed are rechecked before and after gateway HTTP. Only the configured local
        owner/area is supported; Trust and remote-owner approvals remain closed. Current sharing
        consent, reviewer authority, active non-tombstoned source version, reviewed evidence and
        individually verified publication receipts select exact keys, never whole-space pull/CAR.
        Registration intent retains every prior stream and explicitly disables withdrawals.
        Lost registration replies replay the same durable operation, not a replacement UUID.
        No SQL locks span HTTP. Signed entries and attestation expiry are verified again under
        authorization/source locks; bounded JSON bytes are serialized before the protected audit
        and delivery commit. No-store. Empty approved projects return an empty signed page.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingProjectSnapshotRequest' }
      responses:
        '200':
          description: Device, nonce, exact project scope, revisions and cursor-bound signed gateway page; no raw captures or arbitrary reference traversal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedProjectPage' }
        '400': { description: Invalid or unbounded cursor; unknown body fields rejected. }
        '401': { description: Revoked, expired or missing credential. }
        '403': { description: Not an approved local device or current offline authority denied. }
        '409': { description: Nonce reuse changed bytes, catalog, source eligibility, registration or cursor changed. }
        '413': { description: Body, retained stream set or selective response exceeds bounded size. }
        '503': { description: Verified gateway unavailable or registration confirmation uncertain; sanitized durable operation UUID may be returned. Retry exact request, never assume delivery or revocation. }
  /v1/onboarding/delegated-grants:
    post:
      operationId: applyCompanyDelegatedGrant
      x-stability: internal
      summary: Apply an owner-enrolled company direct grant or revoke
      description: Exact current ServiceToken principal and token UUID, explicit project AuthManage and configured role ceiling required. Exact shared no-trailing-slash OIDC namespace may create an absent pre-login identity but never reactivate disabled humans; other issuer configurations fail closed rather than silently aliasing. Only absent direct rows may be claimed; locally-owned grants conflict. Company ownership survives revoke. Effect, audit and immutable receipt commit together. Exact replay returns a historical receipt plus freshly inspected current direct/group rights, never revives authority. Trust administration denied; catalog revision is unrelated. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyGrantRequest' }
      responses:
        '200':
          description: Historical transaction receipt and separately timestamped current rights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyGrantResult' }
        '400': { description: Invalid bounded role or identity; Trust rejected. }
        '401': { description: Credential expired or revoked. }
        '403': { description: Exact delegate, namespace, project permission or ceiling denied. }
        '409': { description: Changed request, ownership or revision. }
  /v1/onboarding/delegated-grants/operations/{operation_id}:
    get:
      operationId: inspectCompanyDelegatedGrant
      x-stability: internal
      summary: Inspect a historical owner receipt with fresh effective rights
      parameters:
        - { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: company_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exact enrolled delegate only; current project authority required. No-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyGrantResult' }
        '403': { description: Current owner delegate or project authority denied. }
        '404': { description: No committed owner operation. }
  /v1/admin/onboarding/company/configuration:
    get:
      operationId: inspectCompanyOnboardingConfiguration
      x-stability: internal
      summary: Inspect enrolled company owners without server transport or secrets
      responses:
        '200':
          description: Global administrator only; no-store. Trust is remote expertise, never delegated local access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyOnboardingView' }
        '403': { description: Required global administration or valid bounded configuration missing. }
  /v1/admin/onboarding/company/operations:
    get:
      operationId: listCompanyOnboardingOperations
      x-stability: internal
      summary: List up to one hundred durable company operation journals
      responses:
        '200':
          description: Global administrator only; historical metadata, no current rights. No-store.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CompanyOperationStatus' } }
    post:
      operationId: startCompanyOnboardingOperation
      x-stability: internal
      summary: Journal an exact request before one configured owner call
      description: Writable company global administrator with ordinary CSRF rules. Explicit HTTPS owner registry and restricted server-only credential; no imported URLs or inherited human cookies. No database locks span HTTP. Lost confirmation is uncertain. Exact repeat reads journal without another effect; use explicit reconcile. This is grant/revoke only, not fleet disable or remote-device approval. No-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyGrantRequest' }
      responses:
        '200':
          description: Durable pending/confirmed/rejected/uncertain state; current rights only from verified fresh owner reply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyOperationStatus' }
        '409': { description: Changed bytes or owner origin under the same operation identity. }
        '503': { description: External effect may have occurred; sanitized operation UUID identifies durable intent. }
  /v1/admin/onboarding/company/operations/{operation_id}:
    get:
      operationId: inspectCompanyOnboardingOperation
      x-stability: internal
      summary: Read historical company journal without asserting current remote rights
      parameters:
        - { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Global administrator only; current_access is null. No-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyOperationStatus' }
        '404': { description: Company intent not found. }
  /v1/admin/onboarding/company/operations/{operation_id}/reconcile:
    post:
      operationId: reconcileCompanyOnboardingOperation
      x-stability: internal
      summary: Inspect the owner, then replay the exact request only if absent
      parameters:
        - { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fresh verified rights are separate from historical receipt; unavailable owner remains uncertain, never a successful fleet revoke. No-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyOperationStatus' }
        '409': { description: Owner origin or currently enrolled policy changed. }
        '503': { description: External effect may have occurred; inspect durable operation UUID. }
  /v1/onboarding/device/start:
    post:
      operationId: startDeviceEnrollment
      x-stability: internal
      summary: startDeviceEnrollment
      description: >-
        Public bounded start: multi_user, explicit local area identity and HTTPS company origin required. Socket-peer IP limit ten per minute; at most 1000 unexpired pending requests. Exact request replay preserves original code/expiry. Client creates and stores both secrets before submitting only digests. Responses are no-store. No scoped offline delivery or fleet authority is implemented by this metadata surface.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDeviceStartRequest' }
      responses:
        '200':
          description: Exact bounded enrollment metadata or bound revocation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDeviceStartResponse' }
        '401': { description: Invalid proof or disabled/expired general credential. }
        '403': { description: Required identity, current role, configuration or browser CSRF missing. }
        '409': { description: Changed request/decision, already approved cancellation, or stale manifest revision. }
        '410': { description: Pending challenge expired or request already decided. }
        '429': { description: Peer start capacity or authenticated poll timing limit reached. }
  /v1/onboarding/device/poll:
    post:
      operationId: pollDeviceEnrollment
      x-stability: internal
      summary: pollDeviceEnrollment
      description: Public poll proves separate poll secret before timing updates. Two-second polling interval. Ten-minute challenge lifetime. Never returns any raw credential. Responses are no-store. No scoped offline delivery or fleet authority is implemented by this metadata surface.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDevicePollRequest' }
      responses:
        '200':
          description: Exact bounded enrollment metadata or bound revocation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDevicePollResponse' }
        '401': { description: Invalid proof or disabled/expired general credential. }
        '403': { description: Required identity, current role, configuration or browser CSRF missing. }
        '409': { description: Changed request/decision, already approved cancellation, or stale manifest revision. }
        '410': { description: Pending challenge expired or request already decided. }
        '429': { description: Peer start capacity or authenticated poll timing limit reached. }
  /v1/onboarding/device/cancel:
    post:
      operationId: cancelDeviceEnrollment
      x-stability: internal
      summary: cancelDeviceEnrollment
      description: Separate poll proof cancels pending enrollment, including expired pending requests. Exact denied replay is harmless. Approved enrollment returns409 regardless challenge expiry; use exact device credential logout. Responses are no-store. No scoped offline delivery or fleet authority is implemented by this metadata surface.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDevicePollRequest' }
      responses:
        '200':
          description: Exact bounded enrollment metadata or bound revocation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDeviceCancelResponse' }
        '401': { description: Invalid proof or disabled/expired general credential. }
        '403': { description: Required identity, current role, configuration or browser CSRF missing. }
        '409': { description: Changed request/decision, already approved cancellation, or stale manifest revision. }
        '410': { description: Pending challenge expired or request already decided. }
        '429': { description: Peer start capacity or authenticated poll timing limit reached. }
  /v1/onboarding/device/review:
    get:
      operationId: reviewDeviceEnrollment
      x-stability: internal
      summary: reviewDeviceEnrollment
      description: Current human OIDC browser session only. Shows exact device fingerprint and current local reviewed manifests matching configured area/owner. Device, legacy owner and service-token identities cannot approve. Responses are no-store. No scoped offline delivery or fleet authority is implemented by this metadata surface.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$' } }
      responses:
        '200':
          description: Exact bounded enrollment metadata or bound revocation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDeviceReview' }
        '401': { description: Invalid proof or disabled/expired general credential. }
        '403': { description: Required identity, current role, configuration or browser CSRF missing. }
        '409': { description: Changed request/decision, already approved cancellation, or stale manifest revision. }
        '410': { description: Pending challenge expired or request already decided. }
        '429': { description: Peer start capacity or authenticated poll timing limit reached. }
  /v1/onboarding/device/approve:
    post:
      operationId: approveDeviceEnrollment
      x-stability: internal
      summary: approveDeviceEnrollment
      description: Human browser session with Origin/CSRF. Locks human, request, current project/caps and reviewed revision. Stale manifest409. Reader/writer cap only, no global admin/federation authority. Empty selection denies. Client credential digest is admitted transactionally; token expires30days. Exact replay cannot revive revoked/expired enrollment. Responses are no-store. No scoped offline delivery or fleet authority is implemented by this metadata surface.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingDeviceApproveRequest' }
      responses:
        '200':
          description: Exact bounded enrollment metadata or bound revocation receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDevicePollResponse' }
        '401': { description: Invalid proof or disabled/expired general credential. }
        '403': { description: Required identity, current role, configuration or browser CSRF missing. }
        '409': { description: Changed request/decision, already approved cancellation, or stale manifest revision. }
        '410': { description: Pending challenge expired or request already decided. }
