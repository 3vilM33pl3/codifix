        credential_issued: { type: boolean }
        token: { type: [string, 'null'], description: One-time first-success secret only. Null for every replay; never stored in audit or returned by listing. }
        projects:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [project_id, role_ceiling, permissions]
            properties:
              project_id: { type: string, format: uuid }
              role_ceiling: { type: string, enum: [reader, writer, operator] }
              permissions: { type: array, items: { type: string, enum: [memory_read, auth_manage] }, minItems: 2, maxItems: 2, uniqueItems: true }
    CompanyDelegatePlan:
      type: object
      additionalProperties: false
      required: [company_id, owner_instance_id, area, issuer, principal_id, token_id, delegation_policy_revision, projects, status, expires_at]
      properties:
        company_id: { type: string, format: uuid }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        issuer: { type: string, format: uri }
        principal_id: { type: string, format: uuid }
        token_id: { type: string, format: uuid }
        delegation_policy_revision: { type: integer, minimum: 1 }
        projects: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/CompanyDelegateProject' } }
        status: { type: string, enum: [unprovisioned, active, inactive, conflict] }
        expires_at: { type: [string, 'null'], format: date-time }
    DeviceProjectSubscription:
      type: object
      additionalProperties: false
      required: [schema_version, device, scope, catalog_revision, authority, receipt_keys]
      properties:
        schema_version: { type: integer, const: 1 }
        device: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ProjectScopeBinding' }
        catalog_revision: { type: integer, minimum: 1 }
        authority: { type: string, format: uuid }
        receipt_keys:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [generation, first_sequence, public_key]
            properties:
              generation: { type: integer, minimum: 1 }
              first_sequence: { type: integer, minimum: 1 }
              public_key: { type: string, maxLength: 256, description: Administrator-pinned crypto encoding; not a URL. }
    OnboardingProjectSnapshotRequest:
      type: object
      additionalProperties: false
      required: [nonce, after, limit]
      properties:
        nonce: { type: string, format: uuid, description: Stable request identity; changed bytes under the same device/nonce conflict. }
        after: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        through: { type: [integer, 'null'], minimum: 0, maximum: 9223372036854775807, description: Omit on first page; pin returned through for subsequent pages. }
        limit: { type: integer, minimum: 1, maximum: 32 }
    ProjectScopeBinding:
      type: object
      additionalProperties: false
      required: [company, area, owner, project, space]
      properties:
        company: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        owner: { type: string, format: uuid }
        project: { type: string, format: uuid }
        space: { type: string, format: uuid }
    ProjectPublicationKey:
      type: object
      additionalProperties: false
      required: [publisher, id]
      properties:
        publisher: { type: string, format: uuid }
        id: { type: string, format: uuid }
    ProjectStreamReview:
      type: object
      additionalProperties: false
      required: [stream, review_id, records, enabled]
      properties:
        stream:
          type: object
          additionalProperties: false
          required: [origin, canonical]
          properties:
            origin: { type: string, format: uuid }
            canonical: { type: string, format: uuid }
        review_id: { type: string, format: uuid }
        records: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ProjectPublicationKey' } }
        enabled: { type: boolean }
    ProjectContentDigest:
      type: object
      additionalProperties: false
      required: [algorithm, hex]
      properties:
        algorithm: { type: string, const: sha256 }
        hex: { type: string, pattern: '^[0-9a-f]{64}$' }
    SignedProjectPage:
      type: object
      additionalProperties: false
      required: [claims, signature]
      properties:
        signature: { type: array, minItems: 64, maxItems: 64, items: { type: integer, minimum: 0, maximum: 255 } }
        claims:
          type: object
          additionalProperties: false
          required: [purpose, key_generation, issued_at, expires_at, request_digest, payload_digest, page]
          properties:
            purpose: { type: string, const: memory-scoped-page-v1 }
            key_generation: { type: integer, minimum: 1 }
            issued_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time, description: Fresh gateway attestation valid for at most thirty seconds. }
            request_digest: { $ref: '#/components/schemas/ProjectContentDigest' }
            payload_digest: { $ref: '#/components/schemas/ProjectContentDigest' }
            page:
              type: object
              additionalProperties: false
              required: [request, authority, through, next, entries]
              properties:
                request:
                  type: object
                  additionalProperties: false
                  required: [nonce, device, scope, catalog_revision, policy_revision, binding_revision, after, through, limit]
                  properties:
                    nonce: { type: string, format: uuid }
                    device: { type: string, format: uuid }
                    scope: { $ref: '#/components/schemas/ProjectScopeBinding' }
                    catalog_revision: { type: integer, minimum: 1 }
                    policy_revision: { type: integer, minimum: 1 }
                    binding_revision: { type: integer, minimum: 1 }
                    after: { type: integer, minimum: 0 }
                    through: { type: [integer, 'null'], minimum: 0 }
                    limit: { type: integer, minimum: 1, maximum: 32 }
                authority: { type: string, format: uuid }
                through: { type: integer, minimum: 0 }
                next: { type: integer, minimum: 0 }
                entries:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [sequence, event]
                    properties:
                      sequence: { type: integer, minimum: 1 }
                      event:
                        oneOf:
                          - type: object
                            required: [kind, stream, delivery, receipt]
                            properties:
                              kind: { type: string, const: record }
                              stream: { type: object, required: [origin, canonical], properties: { origin: { type: string, format: uuid }, canonical: { type: string, format: uuid } } }
                              delivery: { type: object, description: Exact neutral v2/v3 PublicationDelivery, limited to reviewed MemoryVersion/CanonicalState/Evidence; never raw local captures. }
                              receipt: { type: object, description: Individually verified publication AuditReceipt under administrator-pinned gateway keys. }
                          - type: object
                            required: [kind, review]
                            properties:
                              kind: { type: string, const: review }
                              review: { $ref: '#/components/schemas/ProjectStreamReview' }
                          - type: object
                            required: [kind, stream]
                            properties:
                              kind: { type: string, const: withheld }
                              stream: { type: object, required: [origin, canonical], properties: { origin: { type: string, format: uuid }, canonical: { type: string, format: uuid } } }
    CompanyOnboardingView:
      type: object
      additionalProperties: false
      required: [company_id, writes_enabled, owners]
      properties:
        company_id: { type: [string, 'null'], format: uuid }
        writes_enabled: { type: boolean }
        owners:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [owner_instance_id, area, issuer, delegation_policy_revision, grant_management]
            properties:
              owner_instance_id: { type: string, format: uuid }
              area: { type: string, enum: [workshop, homelab, general, trust] }
              issuer: { type: string, format: uri }
              delegation_policy_revision: { type: integer, minimum: 1 }
              grant_management: { type: boolean }
    CompanyGrantRequest:
      type: object
      additionalProperties: false
      required: [company_id, operation_id, owner_instance_id, area, project_id, issuer, subject, operation, role, expected_grant_revision, delegation_policy_revision]
      properties:
        company_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        project_id: { type: string, format: uuid }
        issuer: { type: string, format: uri }
        subject: { type: string, minLength: 1, maxLength: 512 }
        operation: { type: string, enum: [grant, revoke] }
        role: { type: string, enum: [reader, writer, operator] }
        expected_grant_revision: { type: integer, minimum: 0 }
        delegation_policy_revision: { type: integer, minimum: 1 }
    CompanyGrantReceipt:
      type: object
      additionalProperties: false
      required: [request, request_sha256, principal_id, grant_revision, direct_grant_active, committed_at]
      properties:
        request: { $ref: '#/components/schemas/CompanyGrantRequest' }
        request_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        principal_id: { type: string, format: uuid }
        grant_revision: { type: integer, minimum: 1 }
        direct_grant_active: { type: boolean }
        committed_at: { type: string, format: date-time }
    CompanyCurrentAccess:
      type: object
      additionalProperties: false
      required: [observed_at, principal_id, disabled, project, direct_role, grant_company_id, owner_grant_revision, group_roles, permissions]
      properties:
        observed_at: { type: string, format: date-time }
        principal_id: { type: string, format: uuid }
        disabled: { type: boolean }
        project: { type: string, maxLength: 128 }
        direct_role: { type: [string, 'null'], enum: [reader, writer, operator, admin, null] }
        grant_company_id: { type: [string, 'null'], format: uuid }
        owner_grant_revision: { type: [integer, 'null'], minimum: 1 }
        group_roles: { type: array, maxItems: 16, items: { type: string, enum: [reader, writer, operator, admin] } }
        permissions: { type: array, items: { type: string } }
    CompanyGrantResult:
      type: object
      additionalProperties: false
      required: [receipt, current_access]
      properties:
        receipt: { $ref: '#/components/schemas/CompanyGrantReceipt' }
        current_access: { $ref: '#/components/schemas/CompanyCurrentAccess' }
    CompanyOperationStatus:
      type: object
      required: [request, request_sha256, outcome, receipt, current_access]
      properties:
        request: { $ref: '#/components/schemas/CompanyGrantRequest' }
        request_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        outcome: { type: string, enum: [pending, confirmed, rejected, uncertain] }
        receipt: { anyOf: [{ $ref: '#/components/schemas/CompanyGrantReceipt' }, { type: 'null' }] }
        current_access: { anyOf: [{ $ref: '#/components/schemas/CompanyCurrentAccess' }, { type: 'null' }] }
    OnboardingDeviceStartRequest:
      type: object
      additionalProperties: false
