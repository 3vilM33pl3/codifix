    parameters:
      - { $ref: '#/components/parameters/FederationProject' }
      - { $ref: '#/components/parameters/FederationSpace' }
      - { name: collection, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLocalExpertiseCollection
      summary: Inspect the exact stored head review of a local collection.
      description: Same local-human output and current project permissions as listing. Returns the frozen snapshot, advertisement, reviewer and request ID; does not refresh versions, authorize answering or produce a reusable activation request. Includes withdrawn or now-ineligible source content for local review only. A new revision requires explicit drafting and activation. No gateway request is made.
