    OnboardingProject:
      type: object
      required: [project_id, project, revision, reviewed_by, reviewed_at, area, owner_instance_id, repository_url, default_branch, offline_allowed, tools, destinations]
      properties:
        project_id: { type: string, format: uuid }
        project: { type: string, description: Server-resolved local project slug. }
        revision: { type: integer, minimum: 1 }
        reviewed_by: { type: string, format: uuid }
        reviewed_at: { type: string, format: date-time }
        area: { type: string, enum: [workshop, homelab, trust, general] }
        owner_instance_id: { type: string, format: uuid }
        repository_url: { type: string, format: uri }
        default_branch: { type: string }
        offline_allowed: { type: boolean }
        tools: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/OnboardingPinnedTool' } }
        destinations: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/OnboardingDestination' } }
    OnboardingProjects:
      type: object
      required: [schema_version, projects]
      properties:
        schema_version: { const: 1 }
        projects: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/OnboardingProject' } }
    OnboardingDevice:
      type: object
      required: [id, principal_id, name, platform, created_at, last_seen_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    OnboardingDevices:
      type: object
      required: [devices]
      properties:
        devices: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/OnboardingDevice' } }
    OnboardingIdpUserRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, email]
      properties:
        username: { type: string, minLength: 1, maxLength: 150, pattern: '^[a-zA-Z0-9_.@-]+$' }
        display_name: { type: string, minLength: 1, maxLength: 256 }
        email: { type: string, minLength: 1, maxLength: 320 }
    OnboardingIdpOperation:
      type: object
      required: [id, operation, outcome, provider_origin, provider_correlation, request_sha256, provider_user_id, invitation_id]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string, enum: [create, invite, disable] }
        outcome: { type: string, enum: [pending, success, error, uncertain] }
        provider_origin: { type: [string, 'null'], format: uri }
        provider_correlation: { type: [string, 'null'], maxLength: 64, description: Invitation name or user attribute used to reconcile the operation. Null for unreconstructable legacy intents. }
        request_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Binds provider target and exact reviewed input without storing the payload. Null for unreconstructable legacy intents. }
        provider_user_id: { type: [integer, 'null'] }
        invitation_id: { type: [string, 'null'], format: uuid, description: Restricted provider invitation metadata. Manage delivery in Authentik. }
    OnboardingIdpOperations:
      type: object
      required: [operations]
      properties:
        operations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OnboardingIdpOperation' } }
    SupervisorQuestionPreview:
      type: object
      required: [profile_digest, request_digest, question, model, destination, source_count, daily_call_limit, daily_usd_micros]
      properties:
        profile_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        request_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        question: { type: string }
        model: { type: string }
        destination: { type: string, enum: [openai] }
        source_count: { type: integer, minimum: 1, maximum: 8 }
        daily_call_limit: { type: integer, minimum: 0 }
        daily_usd_micros: { type: string, pattern: '^[0-9]+$', description: Exact daily US-dollar micro-unit ceiling. }
    SupervisorQuestionRequest:
      type: object
      additionalProperties: false
      required: [request_id, question, profile_digest, request_digest]
      properties:
        request_id: { type: string, format: uuid }
        question: { type: string, minLength: 1, maxLength: 4096 }
        profile_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        request_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
    SupervisorQuestionStatus:
      type: object
      required: [request_id, action_id, state, expires_at, proposal_available]
      properties:
        request_id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        state: { type: string }
        expires_at: { type: string, format: date-time }
        proposal_available: { type: boolean }
    SupervisorReviewRequest:
      type: object
      additionalProperties: false
      required: [request_id, proposal_digest, decision]
      properties:
        request_id: { type: string, format: uuid }
        proposal_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        decision: { type: string, enum: [approve, reject] }
    SupervisorReviewReceipt:
      type: object
      required: [request_id, action_id, proposal_digest, decision, reviewer_id, recorded_at]
      properties:
        request_id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        proposal_digest: { type: string }
        decision: { type: string, enum: [approve, reject] }
        reviewer_id: { type: string, format: uuid }
        recorded_at: { type: string, format: date-time }
    SupervisorProposalDetail:
      type: object
      required: [project_id, action_id, proposal_digest, question, summary, proposal, citations, created_at, review, can_review]
      properties:
        project_id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        proposal_digest: { type: string }
        question: { type: string }
        summary: { type: string }
        proposal: { type: string, enum: [none, ask_human, propose_correction, review_release] }
        created_at: { type: string, format: date-time }
        can_review: { type: boolean }
        review:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorReviewReceipt' }
            - { type: 'null' }
        citations:
          type: array
          maxItems: 8
          items:
            type: object
            required: [index, canonical_id, version_id, version, evidence_digest]
            properties:
              index: { type: integer, minimum: 0, maximum: 7 }
              canonical_id: { type: string, format: uuid }
              version_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
              evidence_digest: { type: string }
    SupervisorPolicyRequest:
      type: object
      additionalProperties: false
      required: [request_id, instance_id, policy_revision, expected_enabled, enabled]
      properties:
        request_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        policy_revision: { type: string, format: uuid }
        expected_enabled: { type: boolean }
        enabled: { type: boolean, description: Must differ from expected_enabled. }
    SupervisorPolicyResponse:
      type: object
      required: [request_id, instance_id, policy_revision, enabled, replayed]
      properties:
        request_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        policy_revision: { type: string, format: uuid }
        enabled: { type: boolean, description: Historical request outcome; inspect fresh policy after replay. }
        replayed: { type: boolean }
    SupervisorResponse:
      type: object
      required: [read_only, execution, snapshot]
      properties:
        read_only: { type: boolean }
        execution: { type: string, enum: [not_integrated] }
        deterministic_checks_configured: { type: boolean, default: false, description: Operator opt-in only; not proof of current health or Pi activation. }
        model_work:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SupervisorModelWorkStatus' }
        can_control: { type: boolean, default: false, description: UI hint only; mutations recheck current authority. }
        snapshot:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SupervisorSnapshot' }
    SupervisorModelWorkStatus:
      type: object
      description: Process-local single-proposal observation, not autonomous agency. Durable action history is authoritative after restart. No source or provider payloads.
      required: [state, observed_at, action_id, attempt_id, action_state]
      properties:
        state: { type: string, enum: [starting, waiting_for_database, awaiting_authority, ready, running, completed, stored, stopped, intervention_required, invalid_configuration, credential_unavailable, artifact_rejected, sandbox_unavailable, cleanup_unconfirmed, delivery_unconfirmed, execution_deadline] }
        observed_at: { type: string, format: date-time }
        action_id: { type: [string, 'null'], format: uuid }
        attempt_id: { type: [string, 'null'], format: uuid }
        action_state: { type: [string, 'null'], enum: [observed, proposed, authorized, queued, running, verified, denied, failed, expired, cancelled, uncertain, null] }
    SupervisorSnapshot:
      type: object
      required: [instance_id, area, observed_at, policy, budget, action_counts, journal, next_after, has_more]
      properties:
        instance_id: { type: string, format: uuid }
        area: { type: [string, 'null'], enum: [trust, homelab, workshop, general, null] }
        observed_at: { type: string, format: date-time }
        last_health_observation:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [action_id, policy_revision, observed_at, next_due_at, project_count, canonical_count, blocked_jobs, failed_jobs, uncertain_actions]
              properties:
                action_id: { type: string, format: uuid }
                policy_revision: { type: string, format: uuid }
                observed_at: { type: string, format: date-time }
                next_due_at: { type: string, format: date-time }
                project_count: { type: string, pattern: '^[0-9]+$' }
                canonical_count: { type: string, pattern: '^[0-9]+$' }
                blocked_jobs: { type: string, pattern: '^[0-9]+$' }
                failed_jobs: { type: string, pattern: '^[0-9]+$' }
                uncertain_actions: { type: string, pattern: '^[0-9]+$' }
        policy:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [revision, enabled, revoked, model, daily_usd_micros, daily_calls]
              properties:
                revision: { type: string, format: uuid }
                enabled: { type: boolean }
                revoked: { type: boolean }
                model: { type: string, const: gpt-5.6-sol }
                daily_usd_micros: { type: string, pattern: '^[0-9]+$' }
                daily_calls: { type: integer, minimum: 0 }
        budget:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [day, charged_usd_micros, reserved_usd_micros, calls]
              properties:
                day: { type: string, format: date }
                charged_usd_micros: { type: string, pattern: '^[0-9]+$' }
                reserved_usd_micros: { type: string, pattern: '^[0-9]+$' }
                calls: { type: integer, minimum: 0 }
        action_counts:
          type: array
          items:
            type: object
            required: [state, count]
            properties:
              state: { type: string, enum: [observed, proposed, authorized, queued, running, verified, denied, failed, expired, cancelled, uncertain] }
              count: { type: string, pattern: '^[0-9]+$' }
        journal:
          type: array
          maxItems: 100
          items:
            type: object
            required: [sequence, action_id, attempt_id, policy_revision, event, recorded_at]
            properties:
              sequence: { type: string, pattern: '^[0-9]+$' }
              action_id: { type: [string, 'null'], format: uuid }
              attempt_id: { type: [string, 'null'], format: uuid }
              policy_revision: { type: string, format: uuid }
              event: { type: string, enum: [policy_installed, policy_enabled, policy_paused, policy_revoked, policy_reduced, observed, proposed, authorized, queued, claimed, renewed, verified, failed, denied, expired, cancelled, uncertain, reserved, begun, released_before_send, settled, settled_over_bound, model_context_bound] }
              recorded_at: { type: string, format: date-time }
        next_after: { type: string, pattern: '^[0-9]+$' }
        has_more: { type: boolean }
    JobStatus:
      type: string
      enum: [queued, running, retry_wait, blocked, failed, succeeded, skipped]
    JobSummary:
      type: object
      required: [id, project_id, operation_id, kind, status, generation, attempts, created_at, available_at, lease_until, last_failure]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        kind: { type: string, enum: [embedding, semantic_dedup, validation_due, consolidation, consolidation_synthesis] }
        status: { $ref: '#/components/schemas/JobStatus' }
        generation: { type: integer }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        available_at: { type: string, format: date-time }
        lease_until: { type: [string, 'null'], format: date-time }
        last_failure: { type: [string, 'null'], description: Safe enumerated classification, never a raw provider error. }
        reason: { type: string, enum: [disabled, no_inputs, dependency_skipped, dry_run, utility_floor, coalesced] }
    FederationStream:
      type: object
      additionalProperties: false
      required: [origin, canonical]
      properties:
        origin: { type: string, format: uuid }
        canonical: { type: string, format: uuid }
    FederationDigest:
      type: object
      required: [algorithm, hex]
      properties:
        algorithm: { const: sha256 }
        hex: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    FederationSourceSelection:
      type: object
      additionalProperties: false
      required: [source, content]
      properties:
        source:
          type: object
          additionalProperties: false
          required: [record_id, version]
          properties:
            record_id: { type: string, format: uuid }
            version: { type: integer, minimum: 1, maximum: 4294967295 }
        content:
          type: object
          additionalProperties: false
          required: [text, summary, memory_type, confidence, importance, tags]
          properties:
            text: { type: string }
            summary: { type: string }
            memory_type: { type: string, description: Existing MemoryType wire value; preserve the preview. }
            confidence: { type: integer, minimum: 0, maximum: 1000000 }
            importance: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            tags: { type: array, items: { type: string } }
    FederationLocalGrant:
      type: object
      additionalProperties: false
      required: [principal, capabilities, enabled]
      properties:
        principal: { type: string, format: uuid }
        enabled: { type: boolean }
        capabilities:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { type: string, enum: [pull, publish, manage_membership] }
    FederationShareReview:
      type: object
      additionalProperties: false
      required: [request_id, canonical, expected, evidence, confirm_future_updates]
      properties:
        request_id: { type: string, format: uuid, description: Non-nil client-generated idempotency key. }
        canonical: { type: string, format: uuid }
        expected: { $ref: '#/components/schemas/FederationSourceSelection' }
        confirm_future_updates: { const: true }
        expected_shared_version: { type: integer, minimum: 0, maximum: 4294967295, default: 0, description: Must match the version shown during review. }
        evidence:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [snapshot, snapshot_digest]
            properties:
              snapshot_digest: { $ref: '#/components/schemas/FederationDigest' }
              snapshot:
                type: object
                additionalProperties: false
                required: [space, stream, public_source_label, selected_text, observed_at]
                properties:
                  space: { type: string, format: uuid }
                  stream: { $ref: '#/components/schemas/FederationStream' }
                  public_source_label: { type: string }
                  selected_text: { type: string }
                  observed_at: { type: string, format: date-time }
    FederationReviewDraft:
      type: object
      additionalProperties: false
      required: [canonical, evidence]
      properties:
        canonical: { type: string, format: uuid }
        evidence:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [public_source_label, selected_text, observed_at]
            properties:
              public_source_label: { type: string }
              selected_text: { type: string }
              observed_at: { type: string, format: date-time }
    FederationSync:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: { type: string, enum: [catch_up, resynchronize, retry] }
    FederationRecordKey:
      type: object
      additionalProperties: false
      required: [publisher, id]
      properties:
        publisher: { type: string, format: uuid }
        id: { type: string, format: uuid }
    FederationActionRequest:
      type: object
      additionalProperties: false
      required: [request_id, action]
      properties:
        request_id: { type: string, format: uuid, description: Reuse unchanged request bytes after an uncertain reply. }
        action:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, member, capability, enabled]
              properties:
                kind: { const: membership }
                member: { type: string, format: uuid }
                capability: { type: string, enum: [pull, publish, manage_membership] }
                enabled: { type: boolean }
            - type: object
              additionalProperties: false
              required: [kind, member]
              properties:
                kind: { const: revoke }
                member: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [kind, proposal]
              properties:
                kind: { const: propose }
                proposal:
                  type: object
                  additionalProperties: false
                  required: [target, base_version, content, evidence]
                  properties:
                    target: { $ref: '#/components/schemas/FederationStream' }
                    base_version: { type: integer, minimum: 1 }
                    content: { $ref: '#/components/schemas/FederationSourceSelection/properties/content' }
                    evidence:
                      type: array
                      maxItems: 16
                      items: { $ref: '#/components/schemas/FederationRecordKey' }
            - type: object
              additionalProperties: false
              required: [kind, proposal, approve]
              properties:
                kind: { const: resolve }
                proposal: { $ref: '#/components/schemas/FederationRecordKey' }
                approve: { type: boolean, description: Approval creates an origin-owned shared version and pauses its local subscription. }
            - type: object
              additionalProperties: false
              required: [kind, canonical]
              properties:
                kind: { const: pause }
                canonical: { type: string, format: uuid }
    FederationSpaceStatus:
      type: object
      required: [project, space, instance, authority, retained_through, observed_capabilities, local, offline_copies_may_remain]
      properties:
        project: { type: string, format: uuid }
        space: { type: string, format: uuid }
        instance: { type: string, format: uuid }
        authority: { type: string, format: uuid }
        retained_through: { type: integer, minimum: 0 }
        observed_capabilities:
          type: array
          items: { type: string, enum: [pull, publish, manage_membership] }
        offline_copies_may_remain: { const: true }
        local:
          type: object
          required: [queued_intents, accepted_not_replicated, replicated_intents, blocked_intents, pending_source_changes, sync_failures, sync_error, retry_at]
          properties:
            queued_intents: { type: integer, minimum: 0 }
            accepted_not_replicated: { type: integer, minimum: 0 }
            replicated_intents: { type: integer, minimum: 0 }
            blocked_intents: { type: integer, minimum: 0 }
            pending_source_changes: { type: integer, minimum: 0 }
            sync_failures: { type: integer, minimum: 0 }
            sync_error: { type: [string, 'null'] }
            retry_at: { type: string, format: date-time }
    AuthProjectAccess:
      type: object
      required: [project, role, source]
      properties:
        project: { type: string }
        role: { type: string, enum: [reader, writer, operator, admin] }
        source: { type: string, description: explicit or authentik_group. }
    AuthPrincipal:
      type: object
      required: [id, kind, display_name, groups, projects]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [human_oidc, service_token, legacy_service_token, internal] }
        display_name: { type: string }
        email: { type: [string, "null"] }
        groups: { type: array, items: { type: string } }
        global_role: { type: [string, "null"], enum: [reader, writer, operator, admin, null] }
        projects: { type: array, items: { $ref: '#/components/schemas/AuthProjectAccess' } }
    AuthMeResponse:
      type: object
      required: [authenticated, mode, read_only, principal]
      properties:
        authenticated: { type: boolean }
        mode: { type: string, enum: [single_user, multi_user] }
        read_only: { type: boolean }
        principal: { $ref: '#/components/schemas/AuthPrincipal' }
    ExpertiseAnswererRequest:
      type: object
      additionalProperties: false
      required: [request_id, principal_id, project, name, confirmed]
      properties:
        request_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        project: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        confirmed: { type: boolean, const: true }
    ExpertiseAnswererResponse:
      type: object
      additionalProperties: false
      required: [request_id, principal_id, project_id, project, permissions, replayed, credential_issued]
      properties:
        request_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [memory_read, bundle_export] }
        replayed: { type: boolean }
        credential_issued: { type: boolean, const: false }
    AuthServiceTokenCreateRequest:
      type: object
      required: [name, project, role]
      properties:
        name: { type: string }
        project: { type: string }
        role: { type: string, enum: [reader, writer, operator] }
        expires_in_seconds: { type: [integer, "null"], minimum: 1 }
    AuthServiceTokenResponse:
      type: object
      required: [id, principal_id, name, token_prefix, created_at, projects]
      properties:
        id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        token: { type: [string, "null"], writeOnly: true, description: Present only in the create response. }
        projects: { type: array, items: { $ref: '#/components/schemas/AuthProjectAccess' } }
    AuthMembershipGrantRequest:
      type: object
      required: [principal_id, project, role]
      properties:
        principal_id: { type: string, format: uuid }
        project: { type: string }
        role: { type: string, enum: [reader, writer, operator, admin] }
    AuthMembership:
      type: object
      required: [id, principal_id, project, role, source, created_at]
      properties:
        id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        project: { type: string }
        role: { type: string, enum: [reader, writer, operator, admin] }
        source: { type: string }
        created_at: { type: string, format: date-time }
    QueryRequest:
      type: object
      required: [project, query]
      properties:
        project: { type: string, description: Project slug to query. }
        query: { type: string, description: Natural-language question. }
        top_k: { type: integer, default: 8, description: Maximum memories retrieved before answer synthesis. }
        min_confidence: { type: [number, "null"], description: Ignore memories below this confidence. }
        include_stale: { type: boolean, default: false, description: Bypass provenance-based stale-source de-ranking. }
        history: { type: boolean, default: false, description: Search all versions including tombstones. }
        filters:
          type: object
          description: Optional type/tag filters.
          properties:
            types: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
          additionalProperties: true
        retrieval_mode:
          type: [string, "null"]
          description: Eval/debug channel isolation; omit for normal queries.
        answer_mode:
          type: [string, "null"]
          enum: [auto, llm, deterministic, null]
          description: auto (default) uses the configured LLM when available; deterministic forces the eval-gated template synthesizer.
    GlobalQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        top_k: { type: integer, default: 8 }
      additionalProperties: true
    QueryResponse:
      type: object
      required: [answer, confidence, results, insufficient_evidence]
      properties:
        answer: { type: string, description: Synthesized answer, or a refusal sentence when evidence is insufficient. }
        confidence: { type: number, description: 0-1 answer confidence. }
        insufficient_evidence: { type: boolean, description: True when the engine refused rather than guessed. }
        results:
          type: array
          items: { $ref: '#/components/schemas/QueryResult' }
        answer_citations:
          type: array
          description: The memories the answer draws from, by result number.
          items:
            type: object
            properties:
              result_number: { type: integer }
              memory_id: { type: string, format: uuid }
              summary: { type: string }
              snippet: { type: string }
            additionalProperties: true
        answer_generation:
          type: object
          description: How the answer was produced (method, cited results, token usage, fallback reason).
          additionalProperties: true
        diagnostics:
          type: object
          description: Per-channel retrieval timings and counts.
          additionalProperties: true
    QueryResult:
      type: object
      required: [memory_id, summary, memory_type, score, snippet]
      properties:
        memory_id: { type: string, format: uuid }
        project: { type: [string, "null"] }
        summary: { type: string }
        memory_type: { type: string, description: One of the 17 canonical memory types. }
        score: { type: number, description: Final ranking score. }
        snippet: { type: string }
        match_kind: { type: string, description: lexical | semantic | hybrid. }
        score_explanation: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        needs_review: { type: boolean, description: Flagged by validation for human review; ranked with a penalty. }
        sources: { type: array, items: { type: object, additionalProperties: true } }
        graph_connections: { type: array, items: { type: object, additionalProperties: true } }
        debug:
          type: object
          description: Ranking components (term_overlap, semantic_similarity, memory_confidence, boosts).
          additionalProperties: true
    CaptureTaskRequest:
      type: object
      required: [project, task_title, user_prompt, writer_id, agent_summary]
      properties:
        project: { type: string }
        task_title: { type: string }
        user_prompt: { type: string, description: The original request or task framing. }
        writer_id: { type: string, description: Stable writer identity; auto-derived by the CLI when empty. }
        writer_name: { type: [string, "null"] }
        agent_summary: { type: string, description: What was done, in one or two sentences. }
        files_changed: { type: array, items: { type: string } }
        git_diff_summary: { type: [string, "null"] }
        tests: { type: array, items: { type: object, additionalProperties: true } }
        notes: { type: array, items: { type: string }, description: Durable facts to preserve as evidence. }
        structured_candidates:
          type: array
          description: Pre-distilled memory candidates; curation still gates them.
          items: { $ref: '#/components/schemas/CaptureCandidateInput' }
        command_output: { type: [string, "null"] }
        idempotency_key: { type: [string, "null"] }
        dry_run: { type: boolean, default: false }
    CaptureCandidateInput:
      type: object
      required: [canonical_text, summary, memory_type]
      properties:
        canonical_text: { type: string, description: The durable claim, self-contained. }
        summary: { type: string }
        memory_type: { type: string }
        confidence: { type: number, default: 0.7 }
        importance: { type: integer, default: 3 }
        tags: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            properties:
              source_kind: { type: string, description: file | commit | note | memory | symbol. }
              file_path: { type: [string, "null"] }
              git_commit: { type: [string, "null"] }
              excerpt: { type: [string, "null"] }
            additionalProperties: true
    CaptureTaskResponse:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        raw_capture_id: { type: string, format: uuid }
        idempotency_key: { type: [string, "null"] }
        dry_run: { type: boolean }
      additionalProperties: true
    CurateRequest:
      type: object
      required: [project]
      properties:
        project: { type: string }
        batch_size: { type: [integer, "null"], description: Limit raw captures processed in one run. }
        raw_capture_id: { type: [string, "null"], format: uuid, description: Curate one specific capture. }
        replacement_policy: { type: [string, "null"], enum: [conservative, balanced, aggressive, null] }
        dry_run: { type: boolean, default: false }
    CurateResponse:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        input_count: { type: integer }
        output_count: { type: integer }
        memory_ids: { type: array, items: { type: string, format: uuid } }
        proposal_count: { type: integer }
        replaced_count: { type: integer }
        replacements: { type: array, items: { type: object, additionalProperties: true } }
        dry_run: { type: boolean }
      additionalProperties: true
    ProjectMemoryGraphResponse:
      type: object
      properties:
        project: { type: string }
        total_memories: { type: integer }
        returned_memories: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              node_kind: { type: string, enum: [memory, source] }
              memory_id: { type: [string, "null"], format: uuid }
              memory_type: { type: [string, "null"] }
              confidence: { type: [number, "null"] }
              importance: { type: [integer, "null"] }
              tags: { type: array, items: { type: string } }
              activation:
                type: [number, "null"]
                description: Decayed ACT-R activation at read time; null when never retrieved.
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              source: { type: string }
              target: { type: string }
              edge_kind: { type: string, enum: [provenance, memory_relation] }
              relation_type: { type: [string, "null"] }
            additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        database: { type: string }
      additionalProperties: true
