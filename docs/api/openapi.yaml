# Memory Layer HTTP API v1 — OpenAPI 3.1 specification.
#
# Source of truth for the public API surface, served by the service at
# GET /v1/openapi.yaml. A contract test in mem-service keeps this file's
# path inventory in sync with the axum router (routes.rs) in both
# directions.
#
# Stability contract: operations marked x-stability: core are frozen —
# existing fields never change meaning, additive fields may appear, and
# clients must ignore unknown fields. Operations marked x-stability:
# internal form the service control plane (loops, watchers, agents,
# admin) and may change between minor versions.
openapi: 3.1.0
info:
  title: Memory Layer API
  version: "1.0"
  description: |
    Local-first project memory for coding agents: capture completed work,
    curate it into durable memories, and query it back with cited answers
    or honest refusals. The service listens on localhost only by default;
    nothing leaves your machine.
servers:
  - url: http://127.0.0.1:4040
    description: Local service (native install default)
  - url: http://localhost:4040
    description: Bundled Docker Compose stack
security:
  - bearerToken: []
paths:
  /v1/supervisor/policy:
    post:
      operationId: setLocalSupervisorPolicyEnabled
      summary: Explicitly pause or resume an existing instance policy.
      x-stability: internal
      description: |
        Requires current global system_admin; project roles are insufficient.
        Denied on read-only, evaluation and relay services. Browser writes require
        CSRF and the configured Origin. Exact instance/revision/expected-state
        binding; request UUID is idempotent only for the same actor and terms.
        Policy, supervisor journal and protected auth audit commit together.
        Does not bootstrap, grant sharing/model consent or change limits.
        Resume permits an already configured worker to run eligible approved paid work.
        Retrying a prior request returns its historical receipt, not fresh state.
        Read the supervisor snapshot afterwards. On an unconfirmed outcome,
        inspect or retry the exact request ID; never change its terms.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupervisorPolicyRequest' }
      responses:
        '200':
          description: Committed or reconciled receipt; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorPolicyResponse' }
        '400': { description: Invalid or no-op request. }
        '401': { description: Authentication required. }
        '403': { description: Missing current global authority, invalid CSRF, or disabled writes. }
        '409': { description: Identity, policy revision, expected state or request terms conflict. }
        '503': { description: Outcome unconfirmed; retry identical request ID. }
  /v1/supervisor:
    get:
      operationId: inspectLocalSupervisor
      summary: Instance-wide metadata-only supervisor policy, budget and journal.
      x-stability: internal
      description: |
        Requires global memory_read; project-scoped access is insufficient.
        Does not enroll, enable, claim work or call a model. An enabled persisted
        policy does not establish worker health. This build reports execution
        not_integrated. Missing explicit durable identity returns snapshot null;
        a configured identity must match the database binding. Private proposals,
        questions, prompts, source context and provider bodies are never returned.
      parameters:
        - { name: after, in: query, schema: { type: string, pattern: '^[0-9]+$', default: '0' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Consistent read-only snapshot; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorResponse' }
        '400': { description: Invalid cursor or page bounds. }
        '401': { description: Authentication required. }
        '403': { description: Global memory_read required. }
        '409': { description: Durable identity mismatch. }
        '503': { description: Supervisor database unavailable; diagnostics sanitized. }
  /v1/projects/{slug}/jobs:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectJobs
      summary: Bounded project job inspection, safe failures and queue health.
      x-stability: internal
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } }
      responses:
        '200':
          description: Project-scoped page. No private stage inputs or provider bodies.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, next_after, stats, worker]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
                  next_after: { type: [string, 'null'], format: uuid }
                  stats: { type: object, description: Project-only queue depth, running/retry/blocked/failed counts and oldest ready age in seconds. }
                  worker: { type: object, description: Worker enablement and last poll Unix timestamp, or null before polling. }
        '403': { description: Project access denied. }
        '400': { description: Invalid pagination or filter. }
  /v1/projects/{slug}/jobs/{id}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProjectJob
      summary: Inspect dependencies and bounded attempt history.
      x-stability: internal
      responses:
        '200':
          description: Sanitized job detail; history is newest-first with explicit truncation.
          content:
            application/json:
              schema:
                type: object
                required: [job, dependencies, history, history_truncated]
                properties:
                  job: { $ref: '#/components/schemas/JobSummary' }
                  dependencies: { type: array, items: { type: string, format: uuid } }
                  history: { type: array, maxItems: 200, items: { type: object } }
                  history_truncated: { type: boolean }
        '403': { description: Project access denied. }
        '404': { description: No such job in this project. }
  /v1/projects/{slug}/jobs/{id}/retry:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryProjectJob
      summary: Explicit idempotent retry retaining inputs, completed stages and history.
      description: Requires loops_run, memory_curate and current original execution authority. Browser sessions require CSRF. Denied in read-only mode. Running and successful jobs cannot restart.
      x-stability: internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id]
              properties:
                request_id: { type: string, format: uuid }
      responses:
        '200':
          description: Retry generation opened, or original receipt replayed.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, job_id, generation]
                properties:
                  request_id: { type: string, format: uuid }
                  job_id: { type: string, format: uuid }
                  generation: { type: integer }
        '403': { description: Permission, CSRF or read-only denial. }
        '409': { description: Ineligible job state or request ID conflict. }
  /v1/openapi.yaml:
    get:
      operationId: get_v1_openapi_yaml
      summary: "This specification, served by the running service."
      tags: ["System"]
      x-stability: core
      security: []
      responses:
        "200":
          description: OK
