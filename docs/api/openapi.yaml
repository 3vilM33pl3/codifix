        repository_url: { type: string, format: uri, description: Credential-free HTTPS repository identity. }
        default_branch: { type: string, minLength: 1, maxLength: 256 }
        offline_allowed: { type: boolean, description: Must be false for Trust. Metadata only until scoped offline delivery is implemented. }
        tools: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/OnboardingPinnedTool' } }
        destinations: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/OnboardingDestination' } }
    OnboardingProjectReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, entry]
