components:
  parameters:
    FederationProject:
      name: slug
      in: path
      required: true
      schema: { type: string }
    FederationSpace:
      name: space
      in: path
      required: true
      schema: { type: string, format: uuid, description: Administrator-enrolled non-nil space UUID. }
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        An explicitly issued Memory Layer service token in either mode, or the
        installation-owner [service].api_token in single-user mode. Scoped
        tokens retain project permissions, expiry and revocation; invalid tokens
        never fall back to anonymous access. Browser clients use an
        HttpOnly OIDC session cookie instead; browser mutations additionally
        require the session CSRF value and the configured public Origin.
  schemas:
    OwnerDeviceCatalogRequest:
      type: object
      additionalProperties: false
      required: [company_id, owner_instance_id, area, issuer, subject, delivery_policy_revision]
      properties:
        company_id: { type: string, format: uuid }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        issuer: { type: string, format: uri, maxLength: 2048 }
        subject: { type: string, minLength: 1, maxLength: 512 }
        delivery_policy_revision: { type: integer, minimum: 1 }
    OwnerDeviceCatalogProject:
      type: object
      additionalProperties: false
      required: [project, manifest_sha256]
      properties:
        project: { $ref: '#/components/schemas/OnboardingDeviceReviewProject' }
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    OwnerDeviceCatalogResponse:
      type: object
      additionalProperties: false
      required: [request_sha256, projects, observed_at]
      properties:
        request_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        projects: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/OwnerDeviceCatalogProject' } }
        observed_at: { type: string, format: date-time }
    OwnerDeviceApprovalRequest:
      type: object
      additionalProperties: false
      required: [operation_id, company_id, device_request_id, device_id, credential_sha256, owner_instance_id, area, project_id, issuer, subject, manifest_revision, manifest_sha256, delivery_policy_revision, expires_at]
      properties:
        operation_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        device_request_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        credential_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        project_id: { type: string, format: uuid }
        issuer: { type: string, format: uri, maxLength: 2048 }
        subject: { type: string, minLength: 1, maxLength: 512 }
        manifest_revision: { type: integer, minimum: 1 }
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        delivery_policy_revision: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
    OwnerDeviceApprovalReceipt:
      type: object
