  /v1/auth/login:
    get:
      operationId: get_v1_auth_login
      summary: "Start Authentik OIDC Authorization Code login with PKCE."
      tags: ["Authentication"]
      x-stability: core
      security: []
      parameters:
        - name: return_to
          in: query
          schema: { type: string, default: / }
          description: Local absolute browser path used after a successful callback.
      responses:
        "307": { description: Redirect to the configured Authentik authorization endpoint. }
        "404": { description: OIDC login is disabled in single-user mode. }
        "503": { description: OIDC configuration or provider discovery is unavailable. }
  /v1/auth/callback:
    get:
      operationId: get_v1_auth_callback
      summary: "Validate the Authentik callback and create a browser session."
      tags: ["Authentication"]
      x-stability: core
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "303": { description: Session cookies created; redirect to the validated local return path. }
        "400": { description: Missing, invalid, expired, or provider-rejected callback. }
        "401": { description: ID token signature, issuer, audience, or nonce validation failed. }
  /v1/auth/me:
    get:
      operationId: get_v1_auth_me
      summary: "Return the authenticated principal and effective project access."
      tags: ["Authentication"]
      x-stability: core
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMeResponse' }
        "401": { description: No valid browser session or service token. }
  /v1/auth/logout:
    post:
      operationId: post_v1_auth_logout
      summary: "Revoke the current browser session and expire its cookies."
      tags: ["Authentication"]
      x-stability: core
      responses:
        "200": { description: Session revoked. }
        "403": { description: Browser CSRF or Origin validation failed. }
  /v1/auth/tokens:
    get:
      operationId: get_v1_auth_tokens
      summary: "List service-token metadata without secret values."
      tags: ["Access administration"]
      x-stability: core
      responses:
        "200":
          description: Service-token inventory.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthServiceTokenResponse' } }
    post:
      operationId: post_v1_auth_tokens
      summary: "Create a project-scoped service token; the raw token is returned once."
      tags: ["Access administration"]
      x-stability: core
      requestBody:
        required: true
