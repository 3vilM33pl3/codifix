        role_ceiling: { type: string, enum: [reader, writer, operator], description: Maximum role this configured delegate may grant to humans, not the credential's own role. }
    CompanyDelegateProvisionRequest:
      type: object
      additionalProperties: false
      required: [request_id, company_id, owner_instance_id, area, issuer, principal_id, token_id, delegation_policy_revision, name, projects, expires_in_days, confirmed]
      properties:
        request_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        issuer: { type: string, format: uri }
        principal_id: { type: string, format: uuid }
        token_id: { type: string, format: uuid }
        delegation_policy_revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        projects: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/CompanyDelegateProject' } }
        expires_in_days: { type: integer, minimum: 1, maximum: 90 }
        confirmed: { type: boolean, const: true }
    CompanyDelegateProvisionResponse:
      type: object
      additionalProperties: false
      required: [request_id, company_id, owner_instance_id, area, issuer, principal_id, token_id, delegation_policy_revision, expires_at, projects, replayed, credential_issued, token]
      properties:
        request_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        owner_instance_id: { type: string, format: uuid }
        area: { type: string, enum: [workshop, homelab, general] }
        issuer: { type: string, format: uri }
        principal_id: { type: string, format: uuid }
        token_id: { type: string, format: uuid }
        delegation_policy_revision: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
