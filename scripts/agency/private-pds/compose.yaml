services:
  pds:
    image: ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    restart: unless-stopped
    environment:
      PDS_PORT: "2583"
      PDS_HOSTNAME: pds.${PRIVATE_AT_DOMAIN:?}
      PDS_SERVICE_HANDLE_DOMAINS: .${PRIVATE_AT_DOMAIN:?}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blobs
      PDS_JWT_SECRET: ${PRIVATE_AT_JWT_SECRET:?}
      PDS_ADMIN_PASSWORD: ${PRIVATE_AT_ADMIN_PASSWORD:?}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PRIVATE_AT_ROTATION_KEY:?}
      PDS_INVITE_REQUIRED: "true"
      PDS_DEV_MODE: "false"
      PDS_DISABLE_SSRF_PROTECTION: "false"
      PDS_CRAWLERS: ""
      PDS_DID_PLC_URL: https://unavailable.${PRIVATE_AT_DOMAIN:?}
      NODE_EXTRA_CA_CERTS: /trust/cert.pem
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2583/xrpc/_health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pds:/pds
      - ${PRIVATE_AT_STATE:?}/tls/cert.pem:/trust/cert.pem:ro
    networks: [private]
  directory:
    image: ghcr.io/bluesky-social/pds@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    restart: unless-stopped
    entrypoint: [node, /app-setup/directory.cjs]
    environment:
      PRIVATE_AT_ADMIN_PASSWORD: ${PRIVATE_AT_ADMIN_PASSWORD:?}
      PRIVATE_AT_DOMAIN: ${PRIVATE_AT_DOMAIN:?}
      PRIVATE_AT_FIRST: ${PRIVATE_AT_FIRST:?}
      PRIVATE_AT_SECOND: ${PRIVATE_AT_SECOND:?}
      PRIVATE_AT_UID: ${PRIVATE_AT_UID:?}
      PRIVATE_AT_GID: ${PRIVATE_AT_GID:?}
    volumes:
      - ./directory.cjs:/app-setup/directory.cjs:ro
      - ${PRIVATE_AT_STATE:?}/tls:/tls:ro
      - ${PRIVATE_AT_STATE:?}/state:/state
    ports:
      - "127.0.0.1:${PRIVATE_AT_PORT:?}:2584"
    networks:
      local_access: {}
      private:
        aliases:
          - pds.${PRIVATE_AT_DOMAIN:?}
          - ${PRIVATE_AT_FIRST:?}.${PRIVATE_AT_DOMAIN:?}
          - ${PRIVATE_AT_SECOND:?}.${PRIVATE_AT_DOMAIN:?}
networks:
  local_access: {}
  private:
    internal: true
volumes:
  pds:
